<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slide!</title>
  </head>
  <body>


    <div class="app">

      <ul id="slide-box"></ul>

      <div id="popup-container" class="popup-container" >
        <div class="popup">
          
          <div class="title-editor-box">

            <div class="color-editors">
              <div class="color-editor">
                <div class="color-editor-label">제목 색상</div>
                <input type="color" id="title-color-editor" value="#000000"></input>
              </div>
              <div class="color-editor">
                <div class="color-editor-label">윤곽선 색상</div>
                <input type="color" id="title-stroke-color-editor" value="#000000"></input>
              </div>
              <div class="color-editor">
                <div class="color-editor-label">그림자 색상</div>
                <input type="color" id="title-shadow-color-editor" value="#000000"></input>
              </div>
              <div class="color-editor">
                <div class="color-editor-label">그림자 투명도</div>
                <input type="range" id="title-shadow-opacity-editor" min="0" max="100" step="1" value="0"></input>
                <input type="number" id="title-shadow-opacity-label-editor" min="0" max="100" step="1" value="0"></input>
              </div>
            </div>

          </div>
          <div class="text-editors" id="text-editors">
            <input type="text" id="title-editor" class="title-editor"></input>
            <textarea rows="4" cols="10" id="text-editor" class="text-editor"></textarea>
          </div>

          <div class="text-editor-box">
          
            <div class="color-editors">
              <div class="color-editor">
                <div class="color-editor-label">가사 색상</div>
                <input type="color" id="text-color-editor" value="#000000"></input>
              </div>
              <div class="color-editor">
                <div class="color-editor-label">윤곽선 색상</div>
                <input type="color" id="text-stroke-color-editor" value="#000000"></input>
              </div>
              <div class="color-editor">
                <div class="color-editor-label">그림자 색상</div>
                <input type="color" id="text-shadow-color-editor" value="#000000"></input>
              </div>
              <div class="color-editor">
                <div class="color-editor-label">그림자 투명도</div>
                <input type="range" id="text-shadow-opacity-editor" min="0" max="100" step="1" value="0"></input>
                <input type="number" id="text-shadow-opacity-label-editor" min="0" max="100" step="1" value="0"></input>
              </div>
            </div>
          </div>


          <div class="popup-button-box">
            <button id="cancel-popup" class="cancel-popup">취소</button>
            <button id="save-popup" class="save-popup">저장</button>
          </div>

        </div>
      </div>

      <div id="sort-popup-container" class="popup-container">
        <div class="popup">
          
          <ul id="sort-slide-box" class="sort-slide-box">
          </ul>

          <div class="popup-button-box">
            <button id="cancel-sort-popup" class="cancel-popup">취소</button>
            <button id="save-sort-popup" class="save-popup">저장</button>
          </div>

        </div>
      </div>

      <div id="file-popup-container" class="popup-container">
        <div class="popup">
          
          <div id="drop-file-box" class="drop-file-box">
            <div class="drop-file-text">파일을 드래그하여 추가하세요.</div>
          </div>

          <ul id="file-list" class="file-list">
          </ul>

          <div class="popup-button-box">
            <button id="cancel-file-popup" class="cancel-popup">취소</button>
            <button id="save-file-popup" class="save-popup">저장</button>
          </div>

        </div>
      </div>

      <div id="edit-setting-popup-container" class="popup-container">
        <div class="popup">
          
          <ul class="setting-list">
            <li class="setting-item">
              <div class="setting-label">타이틀 크기</div>
              <input type="number" id="title-size" class="setting-input" value="32"></input>
            </li>
            <li class="setting-item">
              <div class="setting-label">본문 크기</div>
              <input type="number" id="text-size" class="setting-input" value="24"></input>
            </li>
          </ul>

          <div class="popup-button-box">
            <button id="close-setting-popup" class="save-popup">닫기</button>
          </div>

        </div>
      </div>

      <div class="footer">

        <div class="menu-button">
          <button id="manage-imges">
            <svg width="45px" height="45px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M14.2639 15.9376L12.5958 14.2835C11.7909 13.4852 11.3884 13.0861 10.9266 12.9402C10.5204 12.8119 10.0838 12.8166 9.68048 12.9537C9.22188 13.1096 8.82814 13.5173 8.04068 14.3327L4.04409 18.2802M14.2639 15.9376L14.6053 15.5991C15.4112 14.7999 15.8141 14.4003 16.2765 14.2544C16.6831 14.1262 17.12 14.1312 17.5236 14.2688C17.9824 14.4252 18.3761 14.834 19.1634 15.6515L20 16.4936M14.2639 15.9376L18.275 19.9566M18.275 19.9566C17.9176 20.0001 17.4543 20.0001 16.8 20.0001H7.2C6.07989 20.0001 5.51984 20.0001 5.09202 19.7821C4.71569 19.5904 4.40973 19.2844 4.21799 18.9081C4.12796 18.7314 4.07512 18.5322 4.04409 18.2802M18.275 19.9566C18.5293 19.9257 18.7301 19.8728 18.908 19.7821C19.2843 19.5904 19.5903 19.2844 19.782 18.9081C20 18.4803 20 17.9202 20 16.8001V16.4936M12.5 4L7.2 4.00011C6.07989 4.00011 5.51984 4.00011 5.09202 4.21809C4.71569 4.40984 4.40973 4.7158 4.21799 5.09213C4 5.51995 4 6.08 4 7.20011V16.8001C4 17.4576 4 17.9222 4.04409 18.2802M20 11.5V16.4936M14 10.0002L16.0249 9.59516C16.2015 9.55984 16.2898 9.54219 16.3721 9.5099C16.4452 9.48124 16.5146 9.44407 16.579 9.39917C16.6515 9.34859 16.7152 9.28492 16.8425 9.1576L21 5.00015C21.5522 4.44787 21.5522 3.55244 21 3.00015C20.4477 2.44787 19.5522 2.44787 19 3.00015L14.8425 7.1576C14.7152 7.28492 14.6515 7.34859 14.6009 7.42112C14.556 7.4855 14.5189 7.55494 14.4902 7.62801C14.4579 7.71033 14.4403 7.79862 14.4049 7.97518L14 10.0002Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div>파일추가</div>
        </div>

        <div class="menu-button">
          <button id="resort-slides">
            <svg width="45px" height="45px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M16 18L16 6M16 6L20 10.125M16 6L12 10.125" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 6L8 18M8 18L12 13.875M8 18L4 13.875" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>     
          </button>
          <div>순서수정</div>
        </div>

        <div class="menu-button">
          <button id="reset-slides">
            <svg fill="currentColor" width="38px" height="38px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4,23H20a1,1,0,0,0,1-1V6a1,1,0,0,0-.293-.707l-4-4A1,1,0,0,0,16,1H4A1,1,0,0,0,3,2V22A1,1,0,0,0,4,23ZM5,3H15.586L19,6.414V21H5Zm11,9a1,1,0,0,1-1,1H9a1,1,0,0,1,0-2h6A1,1,0,0,1,16,12Z"/></svg>      
          </button>
          <div>전체삭제</div>
        </div>

        <div class="menu-button">
          <button id="export-slides">
            <svg fill="currentColor" height="35px" width="35px" version="1.1" id="Icon" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 24 24" enable-background="new 0 0 24 24" xml:space="preserve"><path d="M20,24H0V0h14.41L20,5.59v4.38h-2V8h-6V2H2v20h18V24z M14,6h3.59L14,2.41V6z M18.71,20.71l-1.41-1.41L19.59,17H11v-2h8.59l-2.29-2.29l1.41-1.41L23.41,16L18.71,20.71z"/></svg>
          </button>
          <div>내보내기</div>
        </div>

        <div class="menu-button">
          <button id="open_viewer">

            <svg width="32px" height="32px" viewBox="0 0 20 20" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
                <g id="Page-1" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
                    <g id="Dribbble-Light-Preview" transform="translate(-300.000000, -4199.000000)" fill="currentColor"><g id="icons" transform="translate(56.000000, 160.000000)"><path d="M262.4445,4039 L256.0005,4039 L256.0005,4041 L262.0005,4041 L262.0005,4047 L264.0005,4047 L264.0005,4039.955 L264.0005,4039 L262.4445,4039 Z M262.0005,4057 L256.0005,4057 L256.0005,4059 L262.4445,4059 L264.0005,4059 L264.0005,4055.955 L264.0005,4051 L262.0005,4051 L262.0005,4057 Z M246.0005,4051 L244.0005,4051 L244.0005,4055.955 L244.0005,4059 L246.4445,4059 L252.0005,4059 L252.0005,4057 L246.0005,4057 L246.0005,4051 Z M246.0005,4047 L244.0005,4047 L244.0005,4039.955 L244.0005,4039 L246.4445,4039 L252.0005,4039 L252.0005,4041 L246.0005,4041 L246.0005,4047 Z" id="full_screen-[#904]"></path></g></g></g></svg>

          </button>
          <div>전체화면</div>
        </div>

        <div class="menu-button">
          <button id="edit-setting">

          <svg width="42px" height="42px" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M600.704 64a32 32 0 0 1 30.464 22.208l35.2 109.376c14.784 7.232 28.928 15.36 42.432 24.512l112.384-24.192a32 32 0 0 1 34.432 15.36L944.32 364.8a32 32 0 0 1-4.032 37.504l-77.12 85.12a357.12 357.12 0 0 1 0 49.024l77.12 85.248a32 32 0 0 1 4.032 37.504l-88.704 153.6a32 32 0 0 1-34.432 15.296L708.8 803.904c-13.44 9.088-27.648 17.28-42.368 24.512l-35.264 109.376A32 32 0 0 1 600.704 960H423.296a32 32 0 0 1-30.464-22.208L357.696 828.48a351.616 351.616 0 0 1-42.56-24.64l-112.32 24.256a32 32 0 0 1-34.432-15.36L79.68 659.2a32 32 0 0 1 4.032-37.504l77.12-85.248a357.12 357.12 0 0 1 0-48.896l-77.12-85.248A32 32 0 0 1 79.68 364.8l88.704-153.6a32 32 0 0 1 34.432-15.296l112.32 24.256c13.568-9.152 27.776-17.408 42.56-24.64l35.2-109.312A32 32 0 0 1 423.232 64H600.64zm-23.424 64H446.72l-36.352 113.088-24.512 11.968a294.113 294.113 0 0 0-34.816 20.096l-22.656 15.36-116.224-25.088-65.28 113.152 79.68 88.192-1.92 27.136a293.12 293.12 0 0 0 0 40.192l1.92 27.136-79.808 88.192 65.344 113.152 116.224-25.024 22.656 15.296a294.113 294.113 0 0 0 34.816 20.096l24.512 11.968L446.72 896h130.688l36.48-113.152 24.448-11.904a288.282 288.282 0 0 0 34.752-20.096l22.592-15.296 116.288 25.024 65.28-113.152-79.744-88.192 1.92-27.136a293.12 293.12 0 0 0 0-40.256l-1.92-27.136 79.808-88.128-65.344-113.152-116.288 24.96-22.592-15.232a287.616 287.616 0 0 0-34.752-20.096l-24.448-11.904L577.344 128zM512 320a192 192 0 1 1 0 384 192 192 0 0 1 0-384zm0 64a128 128 0 1 0 0 256 128 128 0 0 0 0-256z"/></svg>
          </button>
          <div>설정변경</div>
        </div>


      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
